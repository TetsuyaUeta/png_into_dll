[package]
name = "png_into_dll"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
png = "0.18.1"
rfd = "0.17.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Com", "Win32_System_Console", "Win32_System_Environment", "Win32_UI_Shell"] }
